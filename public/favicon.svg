<svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dynamic Rwanda Lush Emerald to Solar Amber Gradient -->
    <linearGradient id="es-fav-bg" x1="4" y1="4" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="55%" stop-color="#059669" />
      <stop offset="85%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- High-Luminance Bolt Gradient -->
    <linearGradient id="es-fav-bolt" x1="20" y1="10" x2="36" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <filter id="es-fav-shadow" x="12" y="8" width="32" height="40" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" floodColor="#064E3B" floodOpacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded Squircle Container -->
  <rect x="4" y="4" width="48" height="48" rx="14" fill="url(#es-fav-bg)" />

  <!-- Subtle Inner Highlight Border -->
  <rect
    x="4.5"
    y="4.5"
    width="47"
    height="47"
    rx="13.5"
    stroke="#FFFFFF"
    stroke-opacity="0.3"
    stroke-width="1"
  />

  <!-- Rolling Hills Arc 1 (Distant Hill) -->
  <path
    d="M6 42C12 34 20 36 28 32C36 28 42 33 50 27V42C50 46.4 46.4 50 42 50H14C9.6 50 6 46.4 6 42Z"
    fill="#022C22"
    fill-opacity="0.35"
  />

  <!-- Rolling Hills Arc 2 (Near Hill) -->
  <path
    d="M6 44C14 38 22 41 32 37C40 33 46 38 50 35V42C50 46.4 46.4 50 42 50H14C9.6 50 6 46.4 6 42V44Z"
    fill="#064E3B"
    fill-opacity="0.5"
  />

  <!-- Solar/Beacon Corona Glow -->
  <circle cx="37" cy="15" r="5" fill="#FBBF24" fill-opacity="0.25" />
  <!-- Solar Accent Beacon Node -->
  <circle cx="37" cy="15" r="2.8" fill="#FDE047" stroke="#F59E0B" stroke-width="0.8" />

  <!-- Dynamic Lightning Bolt -->
  <path
    filter="url(#es-fav-shadow)"
    d="M30 11L18 27H27L23 43L39 25H29.5L33 11H30Z"
    fill="url(#es-fav-bolt)"
  />
</svg>
